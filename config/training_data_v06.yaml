version: v0.6
default_sample_version: jq_cb_train_v1
research_only: true

jqdata:
  account_type: personal_trial
  credentials_file: config/jqdata_credentials.toml
  daily_quota_limit: 500000
  default_daily_hard_cap: 450000
  reserve_quota_for_research: true
  available_range: trial_15m_to_3m
  # Freeze the permission window for this 14-day trial so later resume,
  # coverage and repair jobs use the same dates as the first download plan.
  trial_window_anchor_date: 2026-07-14
  # The lower access boundary moves daily during the 14-day trial. Keeping a
  # full-trial buffer makes every planned date accessible until the last day.
  trial_download_start_buffer_days: 14
  trade_calendar_cache: outputs/cn_trade_calendar.csv
  # Fixed boundaries returned by the trial account on authenticated requests.
  # Dynamic trial rules may only tighten these values, never widen them.
  available_start_date: 2025-04-05
  available_end_date: 2026-04-12
  target_trading_days: 200
  frequency: 5m
  bars_per_day_estimate: 48
  plan_chunk_trading_days: 10
  request_cooldown_seconds: 1.0
  max_failed_plans_per_run: 20
  max_attempts_per_plan: 3
  stale_running_minutes: 60
  cb_fields:
    - open
    - high
    - low
    - close
    - volume
    - money
    - paused
  stock_fields:
    - open
    - high
    - low
    - close
    - volume
    - money
    - paused
    - live_turnover

wind:
  account_type: personal_trial
  provider: auto
  close_after_request: true
  wsd_options: Days=Trading
  field_map:
    live_turnover: turn
    ytm: ytm_b
  weekly_quota_limit: 50000
  weekly_hard_cap: 45000
  reserve_rows: 5000
  validation_run_target_cells: 7000
  validation_fields:
    - live_turnover
  allowed_fields:
    - live_turnover
    - ytm

akshare_static:
  conversion_price_cache_dir: outputs/akshare_conversion_price_history
  request_cooldown_seconds: 2.0
  request_cooldown_jitter_seconds: 0.5
  max_retries: 3
  conversion_price_mismatch_tolerance: 0.08

sample_selection:
  max_sample_size: 200
  active_like_premium_min: 20.0
  active_like_premium_max: 30.0
  shadow_premium_min: 10.0
  shadow_premium_max: 40.0
  broad_premium_min: -10.0
  broad_premium_max: 80.0
  min_days_to_maturity: 183
  max_debt_asset_ratio: 70.0
  severe_debt_asset_ratio: 90.0

canonical:
  canonical_version: jq_training_canonical_v1
  bar_minutes: 5
  no_cross_lunch: true

benchmarks:
  - benchmark_code: CSI300
    benchmark_name: 沪深300
    vendor_code: 000300.XSHG
  - benchmark_code: CSI500
    benchmark_name: 中证500
    vendor_code: 000905.XSHG
  - benchmark_code: CSI1000
    benchmark_name: 中证1000
    vendor_code: 000852.XSHG
  - benchmark_code: CHINEXT
    benchmark_name: 创业板指
    vendor_code: 399006.XSHE
  - benchmark_code: STAR50
    benchmark_name: 科创50
    vendor_code: 000688.XSHG
